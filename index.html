<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบหลังบ้าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1a1d24; --muted: #6b7280; --line: #e5e7eb;
  --brand: #2f6df6; --brand-dark: #1e51d4; --green: #0f9d58; --green-bg: #e6f4ec;
  --red: #d93b3b; --red-bg: #fdecec; --amber: #b7791f; --amber-bg: #fdf3e2;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: "IBM Plex Sans Thai", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }

.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 18px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; color: var(--brand); }
.tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.tab { border: none; background: transparent; cursor: pointer; padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; color: var(--muted); }
.tab:hover { background: var(--bg); }
.tab.active { background: var(--brand); color: #fff; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.sync-status { font-size: 12px; color: var(--muted); }

.view { padding: 18px; max-width: 1200px; margin: 0 auto; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 20px; }
.page-sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.kpi .value.green { color: var(--green); } .kpi .value.red { color: var(--red); }
.kpi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; }
tbody tr:hover { background: #fafbfc; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.row-warn { background: var(--amber-bg) !important; }
.link-cell { color: var(--brand); cursor: pointer; font-weight: 600; }
.link-cell:hover { text-decoration: underline; }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.gray { background: #eef0f2; color: var(--muted); }

.btn, .btn-ghost, .btn-sm, .btn-danger { font: inherit; cursor: pointer; border-radius: 8px; font-weight: 600; border: 1px solid transparent; }
.btn { background: var(--brand); color: #fff; padding: 9px 16px; }
.btn:hover { background: var(--brand-dark); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); padding: 8px 12px; }
.btn-ghost:hover { background: var(--bg); }
.btn-sm { background: var(--bg); border-color: var(--line); color: var(--ink); padding: 5px 10px; font-size: 13px; }
.btn-sm:hover { background: #e9ebef; }
.btn-danger { background: var(--red-bg); color: var(--red); padding: 5px 10px; font-size: 13px; }
.btn-danger:hover { background: #fbdcdc; }

.kebab-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; padding: 4px 10px; font-size: 16px; line-height: 1; color: var(--ink); }
.kebab-btn:hover { background: #e9ebef; }
#kebabPop { position: fixed; z-index: 300; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); min-width: 140px; overflow: hidden; }
#kebabPop button { display: block; width: 100%; text-align: left; padding: 9px 14px; border: none; background: none; cursor: pointer; font: inherit; }
#kebabPop button:hover { background: var(--bg); }
#kebabPop button.danger { color: var(--red); }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
input, select, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.radio-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
.radio-row label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
.radio-row input { width: auto; }
.section-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fafbfc; margin: 6px 0 12px; }
.section-box h4 { margin: 0 0 8px; font-size: 14px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(15,18,24,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto; }
.modal { background: var(--card); border-radius: var(--radius); width: 100%; max-width: 660px; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: pop .12s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); border-radius: var(--radius) var(--radius) 0 0; }
.modal-head h3 { margin: 0; font-size: 17px; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 18px; }

.breakdown { list-style: none; padding: 0; margin: 0; }
.breakdown li { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); gap: 12px; }
.breakdown li.total { font-weight: 700; border-bottom: none; border-top: 2px solid var(--ink); margin-top: 4px; }
.breakdown .ro { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.cart-line { display: grid; grid-template-columns: 2fr 70px 90px 90px 30px; gap: 8px; align-items: center; margin-bottom: 8px; }
.cart-line .ro { text-align: right; font-variant-numeric: tabular-nums; }
.mini-x { background: var(--red-bg); color: var(--red); border: none; border-radius: 6px; cursor: pointer; width: 28px; height: 30px; font-weight: 700; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar select { width: auto; }
.tb-search { width: 260px; max-width: 100%; }
.empty { padding: 36px; text-align: center; color: var(--muted); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; z-index: 400; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-weight: 500; }
.toast.err { background: var(--red); }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding: 10px 4px 0; overflow-x: auto; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 42px; }
.bar { width: 26px; border-radius: 3px 3px 0 0; }
.bar.rev { background: #bcd0fb; } .bar.profit { background: var(--brand); }
.bar-label { font-size: 11px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 8px 16px 0; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

@media (max-width: 620px) {
  .form-grid { grid-template-columns: 1fr; }
  .cart-line { grid-template-columns: 2fr 54px 1fr 30px; }
  .cart-line .hide-sm { display: none; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandName">ระบบหลังบ้าน</div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="stock">สต๊อก</button>
      <button class="tab" data-tab="sku">SKU</button>
      <button class="tab" data-tab="pricing">ราคาซื้อขาย</button>
      <button class="tab" data-tab="waste">วัสดุ &amp; ของเสีย</button>
      <button class="tab" data-tab="summary">สรุปบัญชี</button>
    </nav>
    <div class="topbar-right">
      <span class="sync-status" id="syncStatus"></span>
      <button class="btn-ghost" id="refreshBtn" title="รีเฟรชข้อมูล">↻ รีเฟรช</button>
    </div>
  </header>

  <main id="view" class="view"><div class="loading">กำลังโหลด…</div></main>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="kebabPop" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
// การตั้งค่าเชื่อมต่อ Supabase (แก้ได้ที่บล็อกนี้)
window.APP_CONFIG = {
  SUPABASE_URL: "https://izewpckbieamouwiryza.supabase.co",
  SUPABASE_KEY: "sb_publishable_tQ8GcVnl6eYmV3FXu3gQwA_KJtC-yzO",
};

/* ===================================================================
   ระบบหลังบ้านแบรนด์
=================================================================== */
const { SUPABASE_URL, SUPABASE_KEY } = window.APP_CONFIG;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  materials: [], products: [], bom: [], orders: [], items: [], usages: [], settings: {},
  activeTab: "stock",
  stockSearch: "", stockCat: "", stockSort: "name_asc",
};

// ---------- จัดรูปแบบ ----------
const money = (n) => "฿" + Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n) => Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 4 });
const pct = (n) => (isFinite(n) ? n.toFixed(1) : "0.0") + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => new Date(d).toLocaleDateString("th-TH", { day: "2-digit", month: "short", year: "2-digit" });
const fmtDateTime = (d) => new Date(d).toLocaleString("th-TH", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const thCmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "th", { numeric: true, sensitivity: "base" });

// ---------- คำนวณต้นทุน ----------
const bomOf = (pid) => state.bom.filter((b) => b.product_id === pid);
const materialById = (id) => state.materials.find((m) => m.id === id);
const productById = (id) => state.products.find((p) => p.id === id);
const orderById = (id) => state.orders.find((o) => o.id === id);
const itemsOf = (oid) => state.items.filter((i) => i.order_id === oid);
function unitMaterialCost(pid) {
  return bomOf(pid).reduce((s, b) => s + Number(b.qty_per_unit) * Number(materialById(b.material_id)?.avg_cost || 0), 0);
}
const unitCost = (p) => unitMaterialCost(p.id) + Number(p.labor_cost) + Number(p.overhead_cost);
function wasteAdjCost(p) {
  const w = Number(p.normal_waste_pct) || 0;
  return w > 0 && w < 100 ? unitCost(p) / (1 - w / 100) : unitCost(p);
}

// ---------- searchable (datalist) ----------
const displayMat = (m) => (m.code ? m.code + " · " : "") + m.name;
const displayProd = (p) => p.sku_code + " · " + p.name;
function resolveMat(str) {
  str = (str || "").trim(); if (!str) return null;
  return state.materials.find((m) => displayMat(m) === str)
    || state.materials.find((m) => (m.code && m.code.toLowerCase() === str.toLowerCase()) || m.name.toLowerCase() === str.toLowerCase());
}
function resolveProd(str) {
  str = (str || "").trim(); if (!str) return null;
  return state.products.find((p) => displayProd(p) === str)
    || state.products.find((p) => p.sku_code.toLowerCase() === str.toLowerCase() || p.name.toLowerCase() === str.toLowerCase());
}
const matDatalist = (id) => `<datalist id="${id}">${state.materials.map((m) => `<option value="${esc(displayMat(m))}">`).join("")}</datalist>`;
const prodDatalist = (id) => `<datalist id="${id}">${state.products.filter((p) => p.active).map((p) => `<option value="${esc(displayProd(p))}">`).join("")}</datalist>`;

// ---------- Excel ----------
function readXlsx(file, cb) {
  const reader = new FileReader();
  reader.onload = (e) => { try { const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" }); cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" })); } catch (err) { toast("อ่านไฟล์ไม่สำเร็จ: " + err.message, true); } };
  reader.readAsArrayBuffer(file);
}
function pick(row, names) {
  for (const k of Object.keys(row)) { const nk = String(k).trim().toLowerCase().replace(/\s+/g, ""); for (const n of names) if (nk === n.toLowerCase().replace(/\s+/g, "")) return row[k]; }
  return "";
}
function downloadSheet(filename, aoa, sheetName) {
  const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName); XLSX.writeFile(wb, filename);
}

// ---------- UI helpers ----------
const view = document.getElementById("view");
let toastTimer;
function toast(msg, isErr = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (isErr ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3000);
}
function openModal(title, html) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").hidden = false;
}
function closeModal() { document.getElementById("modalOverlay").hidden = true; document.getElementById("modalBody").innerHTML = ""; }
document.getElementById("modalClose").onclick = closeModal;
// หมายเหตุ: คลิกนอก modal จะ "ไม่" ปิดหน้าต่าง (ต้องกด ✕ เท่านั้น) — ข้อมูลที่กรอกไว้จะไม่หาย
const val = (id) => document.getElementById(id)?.value ?? "";

// ---------- โหลดข้อมูล ----------
async function loadAll() {
  setSync("กำลังซิงก์…");
  try {
    const [mat, prod, bom, ord, items, usages, settings] = await Promise.all([
      sb.from("materials").select("*"),
      sb.from("products").select("*"),
      sb.from("product_materials").select("*"),
      sb.from("sales_orders").select("*").order("sold_at", { ascending: false }),
      sb.from("sales_items").select("*"),
      sb.from("material_usages").select("*").order("used_at", { ascending: false }),
      sb.from("app_settings").select("*"),
    ]);
    for (const r of [mat, prod, bom, ord, items, usages, settings]) if (r.error) throw r.error;
    state.materials = mat.data; state.products = prod.data; state.bom = bom.data;
    state.orders = ord.data; state.items = items.data; state.usages = usages.data;
    state.settings = {}; for (const s of settings.data) state.settings[s.key] = s.value;
    const brand = state.settings.brand?.name; if (brand) document.getElementById("brandName").textContent = brand;
    setSync("ซิงก์ล่าสุด " + new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }));
    render();
  } catch (e) { console.error(e); setSync(""); view.innerHTML = `<div class="empty">เชื่อมต่อฐานข้อมูลไม่สำเร็จ<br><small>${esc(e.message || e)}</small></div>`; }
}
const setSync = (t) => (document.getElementById("syncStatus").textContent = t);

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab"); if (!btn) return;
  state.activeTab = btn.dataset.tab;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === btn));
  render();
});
document.getElementById("refreshBtn").onclick = loadAll;
function render() { ({ stock: renderStock, sku: renderSKU, pricing: renderPricing, waste: renderWaste, summary: renderSummary }[state.activeTab])(); }

/* ================= หน้า 1: สต๊อก ================= */
function stockSorter(key) {
  switch (key) {
    case "name_desc": return (a, b) => thCmp(b.name, a.name);
    case "code_asc": return (a, b) => thCmp(a.code, b.code);
    case "code_desc": return (a, b) => thCmp(b.code, a.code);
    case "qty_desc": return (a, b) => Number(b.qty_on_hand) - Number(a.qty_on_hand);
    case "qty_asc": return (a, b) => Number(a.qty_on_hand) - Number(b.qty_on_hand);
    default: return (a, b) => thCmp(a.name, b.name);
  }
}
function renderStock() {
  const cats = [...new Set(state.materials.map((m) => m.category).filter(Boolean))].sort(thCmp);
  let list = state.materials.slice();
  const q = state.stockSearch.trim().toLowerCase();
  if (q) list = list.filter((m) => (m.name || "").toLowerCase().includes(q) || (m.code || "").toLowerCase().includes(q));
  if (state.stockCat) list = list.filter((m) => (m.category || "") === state.stockCat);
  list.sort(stockSorter(state.stockSort));
  const totalValue = state.materials.reduce((s, m) => s + Number(m.qty_on_hand) * Number(m.avg_cost), 0);
  const lowCount = state.materials.filter((m) => Number(m.qty_on_hand) <= Number(m.reorder_point) && Number(m.reorder_point) > 0).length;
  const rows = list.map((m) => {
    const low = Number(m.qty_on_hand) <= Number(m.reorder_point) && Number(m.reorder_point) > 0;
    return `<tr class="${low ? "row-warn" : ""}">
      <td>${esc(m.code || "")}</td>
      <td>${esc(m.name)} ${low ? '<span class="pill amber">ใกล้หมด</span>' : ""}</td>
      <td>${m.category ? `<span class="pill gray">${esc(m.category)}</span>` : ""}</td>
      <td>${esc(m.use_unit)}</td>
      <td class="num">${qty(m.qty_on_hand)}</td>
      <td class="num">${money(m.avg_cost)}</td>
      <td class="num">${money(Number(m.qty_on_hand) * Number(m.avg_cost))}</td>
      <td class="num">${qty(m.reorder_point)}</td>
      <td class="num"><button class="btn-sm" data-act="restock" data-id="${m.id}">+ เติม</button> <button class="btn-sm" data-act="history" data-id="${m.id}">ประวัติ</button> <button class="btn-sm" data-act="edit-mat" data-id="${m.id}">แก้ไข</button></td>
    </tr>`;
  }).join("");
  view.innerHTML = `
    <div class="page-head">
      <div><h2>สต๊อกวัสดุ</h2><p class="page-sub">ฐานข้อมูลกลางของวัสดุทั้งหมด • ต้นทุนเฉลี่ยถ่วงน้ำหนักอัปเดตอัตโนมัติ</p></div>
      <div style="display:flex;gap:8px"><button class="btn-ghost" data-act="import-mat">⬆ นำเข้า Excel</button><button class="btn" data-act="add-mat">+ เพิ่มวัสดุ</button></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">จำนวนวัสดุ</div><div class="value">${state.materials.length}</div></div>
      <div class="kpi"><div class="label">มูลค่าสต๊อกคงเหลือ</div><div class="value">${money(totalValue)}</div></div>
      <div class="kpi"><div class="label">วัสดุใกล้หมด</div><div class="value ${lowCount ? "red" : ""}">${lowCount}</div></div>
    </div>
    <div class="toolbar">
      <input id="stkSearch" class="tb-search" placeholder="🔍 ค้นหา รหัส/ชื่อวัสดุ" value="${esc(state.stockSearch)}">
      <select id="stkCat"><option value="">ทุกหมวด</option>${cats.map((c) => `<option value="${esc(c)}" ${state.stockCat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <select id="stkSort">

  if (id) payload.active = document.getElementById("s_active")?.checked ?? true;
  if (!payload.sku_code || !payload.name) return toast("กรุณาใส่รหัสและชื่อสินค้า", true);
  let pid = id;
  if (id) { const { error } = await sb.from("products").update(payload).eq("id", id); if (error) return toast(error.message, true); }
  else { const { data, error } = await sb.from("products").insert(payload).select().single(); if (error) return toast(error.message, true); pid = data.id; }
  // ซิงก์ BOM: ลบเดิมทั้งหมดแล้วใส่ใหม่ (ไม่กระทบสต๊อก)
  await sb.from("product_materials").delete().eq("product_id", pid);
  if (formBom.length) await sb.from("product_materials").insert(formBom.map((b) => ({ product_id: pid, material_id: b.material_id, qty_per_unit: b.qty_per_unit })));
  closeModal(); toast(id ? "แก้ไข SKU แล้ว" : "เพิ่ม SKU แล้ว"); await loadAll();
}

      <li><span>ราคาขาย</span><span class="ro">${money(p.selling_price)}</span></li>

async function delSKU(id) {

function cartAdd() {
  const p = resolveProd(val("c_prod")); if (!p) return toast("เลือกสินค้าจากรายการ", true);
  const q = Number(val("c_qty")), price = Number(val("c_price")); if (!q || q <= 0) return toast("ใส่จำนวน", true);
  cart.push({ product_id: p.id, sku: p.sku_code, name: p.name, qty: q, price, unitCost: unitCost(p) });
  document.getElementById("c_prod").value = ""; document.getElementById("c_qty").value = 1; document.getElementById("c_price").value = "";
  renderCart(); recalcFee();
}
function renderCart() {
  const el = document.getElementById("cartList"); if (!el) return;
  el.innerHTML = cart.map((c, i) => `<div class="cart-line"><span>${esc(c.sku)} ${esc(c.name)}</span><span class="ro">${qty(c.qty)}×</span><span class="ro hide-sm">${money(c.price)}</span><span class="ro">${money(c.qty * c.price)}</span><button class="mini-x" data-act="cart-del" data-i="${i}">×</button></div>`).join("") || '<p class="page-sub">ยังไม่มีรายการ</p>';
}
function recalcFee() {
  const sel = document.getElementById("o_channel"); const feePct = sel ? Number(sel.selectedOptions[0]?.dataset.fee || 0) : 0;
  const revenue = cart.reduce((s, c) => s + c.qty * c.price, 0); const feeEl = document.getElementById("o_fee"); if (feeEl) feeEl.value = (revenue * feePct / 100).toFixed(2);
  renderSaleSummary();
}
function renderSaleSummary() {
  const el = document.getElementById("saleSummary"); if (!el) return;
  const revenue = cart.reduce((s, c) => s + c.qty * c.price, 0), cogs = cart.reduce((s, c) => s + c.qty * c.unitCost, 0), gross = revenue - cogs;
  const ship = Number(val("o_ship")) || 0, fee = Number(val("o_fee")) || 0, disc = Number(val("o_disc")) || 0, net = gross - ship - fee - disc;
  el.innerHTML = `<li><span>ยอดขาย</span><span class="ro">${money(revenue)}</span></li><li><span>ต้นทุนสินค้า (วัสดุ+แรง+แฝง)</span><span class="ro">− ${money(cogs)}</span></li><li><span>กำไรขั้นต้น</span><span class="ro">${money(gross)}</span></li><li><span>− ค่าส่ง / ค่าธรรมเนียม / ส่วนลด</span><span class="ro">− ${money(ship + fee + disc)}</span></li><li class="total"><span>กำไรสุทธิ</span><span class="ro" style="color:${net >= 0 ? "var(--green)" : "var(--red)"}">${money(net)}</span></li>`;
}

async function doImportPreorder() {

function renderWaste() {
  const now = new Date();
  if (!state._wfrom) state._wfrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  if (!state._wto) state._wto = todayISO();
  const fromT = new Date(state._wfrom + "T00:00:00").getTime(), toT = new Date(state._wto + "T23:59:59").getTime();
  const inRange = state.usages.filter((u) => { const t = new Date(u.used_at).getTime(); return t >= fromT && t <= toT; });
  const normalVal = inRange.filter((u) => u.usage_type === "normal_waste").reduce((s, u) => s + Number(u.total_cost), 0);
  const abnormalVal = inRange.filter((u) => u.usage_type === "abnormal_waste").reduce((s, u) => s + Number(u.total_cost), 0);
  // ต้นทุนวัสดุที่ขายได้จริงในช่วง (จากออเดอร์)
  const ordersInRange = state.orders.filter((o) => { const t = new Date(o.sold_at).getTime(); return t >= fromT && t <= toT; });
  const cogsMaterial = ordersInRange.reduce((s, o) => s + Number(o.material_cost), 0);
  const wasteRate = (normalVal + cogsMaterial) > 0 ? (normalVal / (normalVal + cogsMaterial)) * 100 : 0;

  const logRows = inRange.slice(0, 40).map((u) => { const m = materialById(u.material_id); return `<tr>
    <td>${fmtDate(u.used_at)}</td>
    <td><span class="pill ${u.usage_type === "normal_waste" ? "amber" : "red"}">${u.usage_type === "normal_waste" ? "ของเสียปกติ" : "ของเสียผิดปกติ"}</span></td>
    <td>${esc(m ? m.name : "?")}</td><td class="num">${qty(u.qty)} ${esc(m?.use_unit || "")}</td><td class="num">${money(u.unit_cost)}</td><td class="num">${money(u.total_cost)}</td>
    <td>${esc(u.reason || "")}</td><td class="num"><button class="btn-danger" data-act="usage-del" data-id="${u.id}">ลบ</button></td>

  // การ์ดต้นทุนเพื่อคืนทุน
  const skuOpts = state.products.filter((p) => p.active).map((p) => `<option value="${p.id}" ${state._beSku === p.id ? "selected" : ""}>${esc(p.sku_code)} ${esc(p.name)}</option>`).join("");
  const beP = productById(state._beSku) || state.products.filter((p) => p.active)[0];
  const beQtyAssume = state._beQty || 100;
  const beUnit = beP ? wasteAdjCost(beP) : 0;

  const beTotal = beUnit + beAbnormalPer;

  view.innerHTML = `
    <div class="page-head"><div><h2>Material Usage &amp; Waste Tracking</h2><p class="page-sub">บันทึกการใช้วัสดุ/ของเสีย ระบบหักสต๊อกและแยกต้นทุนให้อัตโนมัติ</p></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><div class="field" style="margin:0"><label>ตั้งแต่</label><input id="w_from" type="date" value="${state._wfrom}"></div><div class="field" style="margin:0"><label>ถึง</label><input id="w_to" type="date" value="${state._wto}"></div><button class="btn" data-act="usage-new" style="align-self:flex-end">+ บันทึกการใช้วัสดุ</button></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">มูลค่าของเสียปกติ</div><div class="value" style="color:var(--amber)">${money(normalVal)}</div><div class="sub">ในช่วงที่เลือก</div></div>
      <div class="kpi"><div class="label">มูลค่าของเสียผิดปกติ</div><div class="value red">${money(abnormalVal)}</div><div class="sub">ในช่วงที่เลือก</div></div>
      <div class="kpi"><div class="label">อัตราของเสียปกติ</div><div class="value">${pct(wasteRate)}</div><div class="sub">เทียบต้นทุนวัสดุที่ขายได้</div></div>
      <div class="kpi"><div class="label">ต้นทุนวัสดุใช้ไปรวม</div><div class="value">${money(normalVal + abnormalVal + cogsMaterial)}</div><div class="sub">ขาย + ของเสีย</div></div>
    </div>
    <div class="card"><div class="card-head">ต้นทุนเพื่อคืนทุน (Dashboard — ตัวเลขสมมติ ไม่ใช่ต้นทุนจริงของร้าน)</div>
      <div style="padding:14px 16px">
        <div class="form-grid" style="max-width:520px"><div class="field"><label>เลือก SKU</label><select id="be_sku">${skuOpts || '<option value="">— ไม่มีสินค้า —</option>'}</select></div><div class="field"><label>สมมติขาย (ชิ้น)</label><input id="be_qty" type="number" step="any" value="${beQtyAssume}"></div></div>
        <ul class="breakdown" style="max-width:520px">
          <li><span>ต้นทุน/ชิ้น (เผื่อของเสียปกติ${beP && Number(beP.normal_waste_pct) > 0 ? " " + qty(beP.normal_waste_pct) + "%" : ""})</span><span class="ro" id="be_unit">${money(beUnit)}</span></li>
          <li><span>+ เฉลี่ยของเสียผิดปกติ/ชิ้น (${money(abnormalVal)} ÷ <span id="be_qtxt">${qty(beQtyAssume)}</span>)</span><span class="ro" id="be_abn">${money(beAbnormalPer)}</span></li>
          <li class="total"><span>ต้นทุนเพื่อคืนทุน/ชิ้น</span><span class="ro" id="be_total">${money(beTotal)}</span></li>
        </ul>
      </div>
    </div>
    <div class="card"><div class="card-head">ประวัติการใช้วัสดุ/ของเสีย</div><div class="table-wrap"><table>
      <thead><tr><th>วันที่</th><th>ประเภท</th><th>วัสดุ</th><th class="num">ปริมาณ</th><th class="num">ต้นทุน/หน่วย</th><th class="num">มูลค่า</th><th>สาเหตุ</th><th class="num"></th></tr></thead>
      <tbody>${logRows || '<tr><td colspan="8" class="empty">ยังไม่มีบันทึกในช่วงนี้</td></tr>'}</tbody>
    </table></div></div>`;
  document.getElementById("w_from").addEventListener("change", (e) => { state._wfrom = e.target.value; renderWaste(); });
  document.getElementById("w_to").addEventListener("change", (e) => { state._wto = e.target.value; renderWaste(); });
  document.getElementById("be_sku")?.addEventListener("change", (e) => { state._beSku = e.target.value; renderWaste(); });
  document.getElementById("be_qty")?.addEventListener("input", (e) => {
    state._beQty = Number(e.target.value) || 0;
    const per = state._beQty > 0 ? abnormalVal / state._beQty : 0;
    document.getElementById("be_abn").textContent = money(per);
    document.getElementById("be_qtxt").textContent = qty(state._beQty);
    document.getElementById("be_total").textContent = money(beUnit + per);
  });
}

/* ================= หน้า 5: สรุปบัญชี ================= */
function renderSummary() {
  const now = new Date();
  if (!state._from) state._from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  if (!state._to) state._to = todayISO();
  const from = state._from, to = state._to, fromT = new Date(from + "T00:00:00").getTime(), toT = new Date(to + "T23:59:59").getTime();
  const orders = state.orders.filter((o) => { const t = new Date(o.sold_at).getTime(); return t >= fromT && t <= toT; });
  const orderIds = new Set(orders.map((o) => o.id)), items = state.items.filter((i) => orderIds.has(i.order_id));
  const revenue = orders.reduce((s, o) => s + Number(o.revenue), 0), gross = orders.reduce((s, o) => s + Number(o.gross_profit), 0), net = orders.reduce((s, o) => s + Number(o.net_profit), 0);
  const stockValue = state.materials.reduce((s, m) => s + Number(m.qty_on_hand) * Number(m.avg_cost), 0);
  const byProd = {};
  for (const i of items) { const p = productById(i.product_id); if (!byProd[i.product_id]) byProd[i.product_id] = { id: i.product_id, name: p ? p.sku_code + " " + p.name : "?", qty: 0, revenue: 0, profit: 0 }; byProd[i.product_id].qty += Number(i.qty); byProd[i.product_id].revenue += Number(i.line_revenue); byProd[i.product_id].profit += Number(i.line_revenue) - Number(i.line_cost); }
  const best = Object.values(byProd).sort((a, b) => b.qty - a.qty).slice(0, 10);
  const byDay = (toT - fromT) / 86400000 <= 62, groups = {};
  for (const o of orders) { const d = new Date(o.sold_at), key = byDay ? d.toISOString().slice(0, 10) : d.toISOString().slice(0, 7); if (!groups[key]) groups[key] = { rev: 0, net: 0 }; groups[key].rev += Number(o.revenue); groups[key].net += Number(o.net_profit); }
  const gkeys = Object.keys(groups).sort(), maxV = Math.max(1, ...gkeys.map((k) => Math.max(groups[k].rev, groups[k].net)));
  const bars = gkeys.map((k) => { const g = groups[k], label = byDay ? k.slice(8) + "/" + k.slice(5, 7) : k.slice(5) + "/" + k.slice(2, 4); return `<div class="bar-col"><div style="display:flex;align-items:flex-end;gap:2px;height:130px"><div class="bar rev" style="height:${(g.rev / maxV) * 130}px" title="ยอดขาย ${money(g.rev)}"></div><div class="bar profit" style="height:${(Math.max(0, g.net) / maxV) * 130}px" title="กำไรสุทธิ ${money(g.net)}"></div></div><div class="bar-label">${label}</div></div>`; }).join("");
  const bestRows = best.map((b, i) => `<tr><td><span class="link-cell" data-act="detail-prod-sales" data-id="${b.id}">${i + 1}. ${esc(b.name)}</span></td><td class="num">${qty(b.qty)}</td><td class="num">${money(b.revenue)}</td><td class="num"><span style="color:${b.profit >= 0 ? "var(--green)" : "var(--red)"}">${money(b.profit)}</span></td></tr>`).join("");
  view.innerHTML = `
    <div class="page-head"><div><h2>สรุปบัญชี</h2><p class="page-sub">คลิกชื่อสินค้าเพื่อดูรายละเอียดการขาย</p></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><div class="field" style="margin:0"><label>ตั้งแต่</label><input id="sum_from" type="date" value="${from}"></div><div class="field" style="margin:0"><label>ถึง</label><input id="sum_to" type="date" value="${to}"></div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">ยอดขายรวม</div><div class="value">${money(revenue)}</div></div>
      <div class="kpi"><div class="label">กำไรขั้นต้น</div><div class="value">${money(gross)}</div></div>
      <div class="kpi"><div class="label">กำไรสุทธิ</div><div class="value ${net >= 0 ? "green" : "red"}">${money(net)}</div></div>
      <div class="kpi"><div class="label">จำนวนออเดอร์</div><div class="value">${orders.length}</div></div>
      <div class="kpi"><div class="label">มูลค่าสต๊อกคงเหลือ</div><div class="value">${money(stockValue)}</div></div>
    </div>
    <div class="card"><div class="card-head">ยอดขาย &amp; กำไรสุทธิ ${byDay ? "รายวัน" : "รายเดือน"}</div><div class="legend"><span><span class="dot" style="background:#bcd0fb"></span>ยอดขาย</span><span><span class="dot" style="background:var(--brand)"></span>กำไรสุทธิ</span></div><div class="bars">${bars || '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>'}</div></div>
    <div class="card"><div class="card-head">สินค้าขายดี</div><div class="table-wrap"><table><thead><tr><th>สินค้า</th><th class="num">ขายได้ (ชิ้น)</th><th class="num">ยอดขาย</th><th class="num">กำไร</th></tr></thead><tbody>${bestRows || '<tr><td colspan="4" class="empty">ยังไม่มีการขายในช่วงนี้</td></tr>'}</tbody></table></div></div>`;
  document.getElementById("sum_from").addEventListener("change", (e) => { state._from = e.target.value; renderSummary(); });
  document.getElementById("sum_to").addEventListener("change", (e) => { state._to = e.target.value; renderSummary(); });
}
function detailProdSales(pid) {
  const p = productById(pid);
  const fromT = new Date(state._from + "T00:00:00").getTime(), toT = new Date(state._to + "T23:59:59").getTime();
  const rows = state.items.filter((i) => i.product_id === pid).map((i) => ({ i, o: orderById(i.order_id) })).filter((x) => x.o && new Date(x.o.sold_at).getTime() >= fromT && new Date(x.o.sold_at).getTime() <= toT).sort((a, b) => new Date(b.o.sold_at) - new Date(a.o.sold_at));
  const body = rows.map((x) => `<tr><td><span class="link-cell" data-act="detail-order" data-id="${x.o.id}">${fmtDateTime(x.o.sold_at)}</span></td><td>${esc(x.o.channel || "-")}</td><td class="num">${qty(x.i.qty)}</td><td class="num">${money(x.i.line_revenue)}</td><td class="num">${money(Number(x.i.line_revenue) - Number(x.i.line_cost))}</td></tr>`).join("");
  const tQty = rows.reduce((s, x) => s + Number(x.i.qty), 0), tRev = rows.reduce((s, x) => s + Number(x.i.line_revenue), 0), tPro = rows.reduce((s, x) => s + (Number(x.i.line_revenue) - Number(x.i.line_cost)), 0);
  openModal("รายละเอียดการขาย — " + (p ? p.sku_code + " " + p.name : ""), `
    <p class="page-sub">ช่วง ${fmtDate(state._from)} – ${fmtDate(state._to)}</p>
    <div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ช่องทาง</th><th class="num">จำนวน</th><th class="num">ยอดขาย</th><th class="num">กำไร</th></tr></thead>
      <tbody>${body || '<tr><td colspan="5" class="empty">ไม่มีการขายในช่วงนี้</td></tr>'}</tbody>
      <tfoot><tr style="font-weight:700"><td>รวม</td><td></td><td class="num">${qty(tQty)}</td><td class="num">${money(tRev)}</td><td class="num">${money(tPro)}</td></tr></tfoot>
    </table></div>
    <div class="form-actions"><button class="btn" data-act="cancel">ปิด</button></div>`);
}

/* ================= Event delegation ================= */
function showKebab(btn) {
  const kind = btn.dataset.kind, id = btn.dataset.id;
  const items = kind === "sku"
    ? [{ label: "ดูรายละเอียด", act: "detail-sku" }, { label: "แก้ไข", act: "edit-sku" }, { label: "ลบ", act: "del-sku", danger: true }]
    : [{ label: "ดูรายละเอียด", act: "detail-order" }, { label: "แก้ไข", act: "edit-order" }, { label: "ลบ", act: "del-order", danger: true }];
  const pop = document.getElementById("kebabPop");
  pop.innerHTML = items.map((i) => `<button data-act="${i.act}" data-id="${id}" class="${i.danger ? "danger" : ""}">${i.label}</button>`).join("");
  const r = btn.getBoundingClientRect();
  pop.hidden = false;
  pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8) + "px";
  pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 8) + "px";
}
function closeKebab() { document.getElementById("kebabPop").hidden = true; }

document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  const inPop = e.target.closest("#kebabPop");
  if (!inPop) closeKebab();
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "kebab") { showKebab(el); return; }
  if (inPop) closeKebab();
  const A = {
    "add-mat": () => openModal("เพิ่มวัสดุ", materialForm(null)),
    "edit-mat": () => openModal("แก้ไขวัสดุ", materialForm(materialById(id))),
    "save-mat": () => saveMaterial(id),
    "restock": () => { const m = materialById(id); openModal("เติมสต๊อก", restockForm(m)); bindRestockPreview(m); },
    "save-restock": () => saveRestock(id),
    "history": () => showHistory(id),
    "import-mat": () => importMatModal(),
    "do-import-mat": () => doImportMat(),
    "dl-mat-template": () => dlMatTemplate(),
    "add-sku": () => skuForm(null),
    "edit-sku": () => skuForm(productById(id)),
    "save-sku": () => saveSKU(id),
    "detail-sku": () => detailSKU(id),
    "del-sku": () => delSKU(id),
    "fbom-add": () => fbomAdd(),
    "fbom-del": () => fbomDel(Number(el.dataset.i)),
    "manage-channels": () => manageChannels(),
    "ch-add": () => chAdd(),
    "ch-del": () => chDel(Number(el.dataset.i)),
    "save-channels": () => saveChannels(),
    "new-sale": () => newSaleForm(),
    "cart-add": () => cartAdd(),
    "cart-del": () => { cart.splice(Number(el.dataset.i), 1); renderCart(); recalcFee(); },
    "save-sale": () => saveSale(),
    "detail-order": () => detailOrder(id),
    "edit-order": () => editOrder(id),
    "save-order": () => saveOrder(id),
    "eo-item-add": () => eoItemAdd(el.dataset.oid),
    "eo-item-del": () => eoItemDel(id, el.dataset.oid),
    "del-order": () => delOrder(id),
    "import-preorder": () => importPreorderModal(),
    "do-import-preorder": () => doImportPreorder(),
    "dl-preorder-template": () => dlPreorderTemplate(),
    "usage-new": () => usageForm(),
    "usage-save": () => usageSave(),
    "usage-del": () => usageDel(id),
    "detail-prod-sales": () => detailProdSales(id),
    "cancel": () => closeModal(),
  };
  if (A[act]) A[act]();
});
function bindRestockPreview(m) { ["r_qty", "r_price"].forEach((id) => document.getElementById(id)?.addEventListener("input", () => updateRestockPreview(m))); }
window.addEventListener("resize", closeKebab);

loadAll();
  </script>
</body>
